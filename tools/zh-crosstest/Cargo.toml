# [自訂] SC-67：中文輸出轉換後端的交叉測試工具（不屬於 App，不會被打包）。
# 自成 workspace，有自己的 Cargo.lock，避免候選後端的依賴改動 App 的 Cargo.lock。
[package]
name = "zh-crosstest"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[workspace]

[dependencies]
ferrous-opencc = { version = "=0.4.0", default-features = false, features = ["s2t-conversion"] }
opencc-fmmseg = "=0.13.1"
zhconv = { version = "=0.4.2", default-features = false, features = ["mediawiki-tw", "opencc-tw"] }
