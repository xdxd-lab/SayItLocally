# [自訂] SC-57：雲端煙霧測試。只能手動觸發，不用 secrets 也不用第三方 action。
# 在 GitHub 的 macOS runner 建置一次，下載並核對 SenseVoice 權重，對內建測試語音轉寫。
# runner 可選：macos-15（arm64）常因容量不足排不到，可改選 macos-14 或 Intel 的 macos-15-intel。
name: cloud-smoke

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-14
          - macos-15-intel
      breeze:
        # SC-68：另外下載 Breeze ASR 25（約 1.6 GB，固定 commit）並實際辨識內建測試語音。
        description: Also verify Breeze ASR 25
        type: boolean
        default: false
      zh_matrix:
        # SC-67：可選的交叉測試（已下載的模型 × 中文轉換後端），結果印成 Markdown 表格。
        description: Run the model x Chinese converter cross-test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MODEL_ID: sensevoice-small-gguf
      MODEL_FILE: SenseVoiceSmall-Q8_0.gguf
      MODEL_URL: https://huggingface.co/cswk/sayit-asr-gguf/resolve/main/SenseVoiceSmall-Q8_0.gguf
      MODEL_SIZE: "252684608"
      MODEL_SHA256: 6c759ee4c9748c9b3f7a5a60ca74f0f7e685fb9d45d1378fce7cfd62f59adf29
    steps:
      - name: Clone the dispatched commit
        run: |
          set -euo pipefail
          date -u
          # Public repository: no token is used or stored in the git configuration.
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://github.com/$GITHUB_REPOSITORY" src
          if ! git -C src checkout --quiet "$GITHUB_SHA"; then
            git -C src fetch --depth 1 origin "$GITHUB_SHA"
            git -C src checkout --quiet "$GITHUB_SHA"
          fi
          test "$(git -C src rev-parse HEAD)" = "$GITHUB_SHA"
          git -C src log -1 --format='%H %cI'

      - name: Show the environment
        # Run beside rust-toolchain.toml so the pinned Rust is installed and reported.
        working-directory: src/client/src-tauri
        run: |
          set -euo pipefail
          date -u
          uname -a
          sysctl -n hw.ncpu hw.memsize
          rustup toolchain install
          rustc --version
          rustup show active-toolchain
          cargo --version
          node --version
          npm --version
          cmake --version | head -1

      - name: Build the frontend
        working-directory: src/client
        run: |
          set -euo pipefail
          date -u
          npm ci
          npm run build

      # SC-61：前端檢查。失敗不擋後續步驟，逐行印出失敗的測試名稱供對照既有失敗清單。
      - name: Frontend checks
        working-directory: src/client
        continue-on-error: true
        run: |
          set -uo pipefail
          date -u
          status=0
          npx tsc --noEmit || status=1
          node scripts/check-i18n.mjs --strict || status=1
          npx vitest run --reporter=dot --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" || status=1
          node -e '
            const report = require(process.argv[1]);
            const failed = report.testResults.flatMap((file) => file.assertionResults)
              .filter((test) => test.status === "failed").map((test) => test.fullName).sort();
            console.log(`vitest passed=${report.numPassedTests} failed=${report.numFailedTests}`);
            for (const name of failed) console.log(`FAILED: ${name}`);
          ' "$RUNNER_TEMP/vitest.json" || status=1
          exit "$status"

      - name: Download and verify the model
        run: |
          set -euo pipefail
          date -u
          dir="$RUNNER_TEMP/models/$MODEL_ID"
          mkdir -p "$dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error \
            --output "$dir/$MODEL_FILE" "$MODEL_URL"
          size=$(stat -f %z "$dir/$MODEL_FILE")
          sum=$(shasum -a 256 "$dir/$MODEL_FILE" | cut -d ' ' -f 1)
          echo "size=$size sha256=$sum"
          test "$size" = "$MODEL_SIZE"
          test "$sum" = "$MODEL_SHA256"

      - name: Transcribe the bundled test audio
        working-directory: src/client/src-tauri
        run: |
          set -euo pipefail
          date -u
          SAYIT_SMOKE_MODELS_DIR="$RUNNER_TEMP/models" \
            cargo test --locked --bins cloud_smoke_sensevoice -- --ignored --nocapture --test-threads=1
          date -u

      - name: Download, verify and run Breeze ASR 25
        # SC-68：放在交叉測試之前，勾選 zh_matrix 時 Breeze 也進入「模型 × 轉換後端」比較。
        if: ${{ inputs.breeze }}
        working-directory: src/client/src-tauri
        env:
          BREEZE_ID: breeze-asr-25-gguf
          BREEZE_FILE: Breeze-ASR-25-Q8_0.gguf
          BREEZE_URL: https://huggingface.co/handy-computer/Breeze-ASR-25-gguf/resolve/c827f209c3fcb4956f49f9935ae04a0d88b7fae9/Breeze-ASR-25-Q8_0.gguf
          BREEZE_SIZE: "1667964224"
          BREEZE_SHA256: 1650c163cd1623d13b585368ffd87d7e669c5ff23014511e0fa91bb4ce994756
        run: |
          set -euo pipefail
          date -u
          dir="$RUNNER_TEMP/models/$BREEZE_ID"
          mkdir -p "$dir"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --silent --show-error \
            --output "$dir/$BREEZE_FILE" "$BREEZE_URL"
          size=$(stat -f %z "$dir/$BREEZE_FILE")
          sum=$(shasum -a 256 "$dir/$BREEZE_FILE" | cut -d ' ' -f 1)
          echo "size=$size sha256=$sum"
          test "$size" = "$BREEZE_SIZE"
          test "$sum" = "$BREEZE_SHA256"
          SAYIT_SMOKE_MODELS_DIR="$RUNNER_TEMP/models" \
            cargo test --locked --bins cloud_smoke_breeze -- --ignored --nocapture --test-threads=1
          date -u

      # SC-67：交叉測試。先讓 App 把各模型的原始辨識文字寫成 TSV，再由獨立的
      # tools/zh-crosstest 用每個轉換後端轉換並列表。工具有自己的 Cargo.lock，不影響 App。
      - name: Model x converter cross-test
        if: ${{ inputs.zh_matrix }}
        working-directory: src/client/src-tauri
        run: |
          set -euo pipefail
          date -u
          SAYIT_SMOKE_MODELS_DIR="$RUNNER_TEMP/models" SAYIT_ZH_MATRIX_OUT="$RUNNER_TEMP/zh-matrix.tsv" \
            cargo test --locked --bins cloud_smoke_zh_matrix_dump -- --ignored --nocapture --test-threads=1
          cargo run --release --locked --manifest-path ../../tools/zh-crosstest/Cargo.toml -- "$RUNNER_TEMP/zh-matrix.tsv" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          date -u

      # Runs after the smoke step so its result stays visible; a failure here is
      # reported on this step without hiding the smoke result above.
      - name: Run all Rust tests
        # SC-68：前面的煙霧測試或 Breeze 步驟失敗時照樣執行，只有取消時不跑。
        if: ${{ !cancelled() }}
        working-directory: src/client/src-tauri
        continue-on-error: true
        run: |
          set -euo pipefail
          date -u
          cargo test --locked --bins
          date -u
