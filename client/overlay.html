<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SayItLocally Overlay</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      /* 必須撐滿視窗高度，否則 Overlay 根節點的 h-full/items-end 失效，
         內容會貼視窗頂部；流式氣泡讓視窗變高時就會整體上移。 */
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/overlay/main.tsx"></script>
</body>
</html>
