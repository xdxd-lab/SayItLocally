[package]
name = "sayitlocally"
version = "0.1.0"
authors = ["Liu Qianglong", "Claude"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 上透明視窗（懸浮窗、更新通知）必須開；在 Windows 上不起作用。
# 與 tauri.conf.json 的 app.macOSPrivateApi 必須同時開關（tauri-build 會對帳）。
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
dirs = "5"
hostname = "0.4"
whoami = "1"
base64 = "0.22"
# 校驗更新安裝包的 SHA-512（manifest 裡給的是 Base64 編碼）。安裝包下載後會在臨時
# 目錄裡等到使用者點更新，駐留時間可能很長，裝之前必須確認它還是我們下載的那一個。
sha2 = "0.10.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
regex = "1"
# [自訂] SC-67：辨識與 AI 校對輸出轉成台灣正體（Apache-2.0，純 Rust，OpenCC 字典編譯時內嵌）。
ferrous-opencc = { version = "=0.4.0", default-features = false, features = ["s2t-conversion"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
once_cell = "1"
flate2 = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "fs"] }
# WebDAV 備份包要流式 PUT 上去：含音訊的包能有幾個 GB，整包讀進 Vec<u8> 會直接把
# 記憶體打滿。ReaderStream 把檔案轉成 reqwest 能吃的 Stream，配 reqwest 的 stream feature。
tokio-util = { version = "0.7", features = ["io"] }
silero-vad-crs = { version = "=0.4.0", features = ["auto"] }

# GGUF / ggml 本地 ASR 引擎（transcribe.cpp 的官方 Rust 繫結，MIT）。
# 計算後端按平台在下面的 target 段裡選：Cargo 會合並同一依賴在所有生效段裡的 features，
# 寫在通用 [dependencies] 裡的 vulkan 會連 macOS 一起開啟（mac 上沒有 Vulkan SDK）。
#
# Windows：
# dynamic-backends：各計算後端編成可 dlopen 的模組（隱含 shared，libtranscribe
# 本身也是 DLL），執行時按 CPU 指令集挑最優的 ggml-cpu-* 模組。
# vulkan：一個 API 覆蓋 NVIDIA / AMD / Intel / 核顯，沒有就自動回落 CPU。
#   構建需要 Vulkan SDK（編 SPIR-V shader）：裝完要新開終端，VULKAN_SDK 不會進已執行的 shell。
# 不帶 CUDA：官方 CUDA 包 226 MB，Vulkan 已覆蓋同樣的硬體。
# 注意：首次構建會用 CMake 從原始碼編整棵 C++ 樹（約 20 分鐘），之後走快取。
[target.'cfg(windows)'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false
features = ["dynamic-backends", "vulkan"]

# macOS：metal + 靜態連結。不開 dynamic-backends，就不會產出要隨包分發、逐個簽名的
# dylib，build.rs 的暫存步驟也自然跳過（拿不到 DEP_TRANSCRIBE_CPP_RUNTIME_DIR）。
[target.'cfg(target_os = "macos")'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false
features = ["metal"]

# 其它平台（Linux 等）只編 CPU 後端，保證能編過；目前不釋出。
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false

# macOS 系統整合：AppKit / Foundation 走 objc2（與 tauri/tao 用的是同一套版本，
# 型別可以互通）；CoreGraphics / CoreFoundation / Accessibility / CoreAudio / Carbon
# 這些穩定的 C 介面直接在 src/platform/macos/ffi.rs 裡宣告，不再引入第二套繫結。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  # GetProcessMemoryInfo：報告本地模型載入後的真實記憶體佔用（診斷頁 + 調優實測）
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }
# 與 tauri/wry 內部同版本，用於掛 WebView2 的 PermissionRequested 處理器（把麥克風置為持久授權）
webview2-com = "0.39"
# webview2-com 0.39 用的 COM 基礎型別（Interface::cast、PWSTR）。上面的 windows 0.58 是另一套型別，
# 不能混用；掛 ServerCertificateErrorDetected 時要把 ICoreWebView2 cast 成 ICoreWebView2_14。
windows-core = "0.62"

# Release 體積/效能最佳化。panic 保持 unwind：Tauri 與 catch_unwind 依賴它，
# 換成 abort 會讓引擎 panic 直接殺程序。
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
