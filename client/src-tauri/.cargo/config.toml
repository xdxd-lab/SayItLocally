[env]
# 中文 Windows 的 MSVC 預設用系統內碼表(GBK)讀原始檔，而 transcribe.cpp 的
# src/arch/canary/model.cpp 註釋裡有 UTF-8 的 ▁(U+2581)。按 GBK 解碼時那三個
# 位元組會把換行一起吞掉，註釋不閉合 → 幾十條級聯的 C2065/C3927/C4430。
# CL 是 MSVC 認的"前置追加編譯選項"環境變數，用它給所有 C/C++ 編譯加 /utf-8，
# 比改 CMAKE_CXX_FLAGS 安全（不会把 crate 自己设的 /EHsc -W0 冲掉）。
CL = "/utf-8"

# transcribe-cpp 的 vulkan feature 要靠 Vulkan SDK 編 SPIR-V shader，CMake 找的是
# VULKAN_SDK。SDK 安裝器把它寫進 Machine 環境變數，但**已經在執行的 shell 繼承的是
# 舊環境塊**，所以 `tauri dev` / `cargo build` 常常看不到它，報
#   Could NOT find Vulkan (missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR glslc)
# 寫在這裡當兜底：cargo 的 [env] 預設 **不覆蓋**已存在的同名環境變數（force 預設
# 為 false），所以外部/CI 提供的 VULKAN_SDK 優先，這條只在缺失時生效。
# 換 SDK 版本或換機器時改這一行即可（路徑不存在時行為與沒裝 SDK 一致）。
VULKAN_SDK = "C:\\VulkanSDK\\1.4.350.0"

# 測試強制序列。真機模型測試（gguf_asr / local_asr / test_audio）共享同一個全域性
# 引擎（CACHE 互斥鎖），並行跑時 A 測試的計時會把"等 B 測試推理完"算進去，
# report_backend_and_rtf / first_transcribe_after_load_* 這類斷言就會假失敗，
# 還會讀到被別的測試 unload 後的 backend=None。序列的額外代價≈0：推理本來就被
# 鎖序列化了，純邏輯測試又都在毫秒級。
RUST_TEST_THREADS = "1"

# macOS 最低版本，与 tauri.macos.conf.json 的 minimumSystemVersion 保持一致。
# `tauri build/dev` 會自己設這個變數，但直接跑 cargo（check / test / build）時沒人設，
# transcribe-cpp 的 CMake 就按本機系統版本編 ggml（實測 minos 26.5），編出來的東西
# 在舊系統上可能直接崩，還和 tauri 構建的產物對不上快取。只對 Apple 目標生效，Windows 無影響。
MACOSX_DEPLOYMENT_TARGET = "14.0"
